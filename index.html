<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello, World</title>
  <style>
    :root {
      --bg: #0d0f1a;
      --card: rgba(255, 255, 255, 0.06);
      --stroke: rgba(255, 255, 255, 0.12);
      --text: #f4f5fb;
      --muted: #a3a8c3;
      --accent: #7c5cff;
      --accent-2: #22d3ee;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated aurora blobs in the background */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.55;
      z-index: 0;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .blob.one   { width: 420px; height: 420px; background: var(--accent);   top: -120px; left: -80px; }
    .blob.two   { width: 360px; height: 360px; background: var(--accent-2); bottom: -140px; right: -60px; animation-delay: -6s; }
    .blob.three { width: 300px; height: 300px; background: #ff5c8a;          top: 40%; left: 60%; animation-delay: -12s; }

    @keyframes drift {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to   { transform: translate3d(40px, -30px, 0) scale(1.15); }
    }

    .card {
      position: relative;
      z-index: 1;
      padding: 56px 64px;
      border-radius: 28px;
      background: var(--card);
      border: 1px solid var(--stroke);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 90vw;
      animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .eyebrow {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(2.4rem, 7vw, 4.5rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.03em;
      background: linear-gradient(120deg, #fff 10%, var(--accent-2) 50%, var(--accent) 90%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      background-size: 200% auto;
      animation: shine 6s linear infinite;
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }

    p.sub {
      margin-top: 18px;
      color: var(--muted);
      font-size: 1rem;
      max-width: 42ch;
      margin-inline: auto;
    }

    .wave {
      display: inline-block;
      transform-origin: 70% 70%;
      animation: wave 2.4s ease-in-out infinite;
    }

    @keyframes wave {
      0%, 60%, 100% { transform: rotate(0deg); }
      10%, 30%      { transform: rotate(16deg); }
      20%, 40%      { transform: rotate(-8deg); }
    }

    .dot-row {
      margin-top: 32px;
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .dot-row span {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      animation: pulse 1.4s ease-in-out infinite;
    }
    .dot-row span:nth-child(2) { animation-delay: 0.2s; }
    .dot-row span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 100% { opacity: 0.25; transform: scale(0.8); }
      50%      { opacity: 1; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="blob one"></div>
  <div class="blob two"></div>
  <div class="blob three"></div>

  <main class="card">
    <span class="eyebrow">A fresh start</span>
    <h1>Hello, World <span class="wave">👋</span></h1>
    <p class="sub">Your first page is live. Edit <strong>index.html</strong> and make it yours.</p>
    <div class="dot-row"><span></span><span></span><span></span></div>
  </main>
</body>
</html>
